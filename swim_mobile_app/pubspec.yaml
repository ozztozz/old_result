name: swim_mobile_app
description: "TYF Yüzme Sonuçları ve Canlı Yarış Takip Mobil Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ağ & HTTP İstemcisi
  dio: ^5.7.0

  # Yerel Depolama (Tercihler, Seçili Kulüp & Favoriler)
  shared_preferences: ^2.3.3

  # UI Yardımcıları, İkonlar & Tarih Formatlama
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

