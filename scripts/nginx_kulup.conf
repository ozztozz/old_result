server {
    listen 80;
    server_name fkalpha.duckdns.org kulup.130-61-177-72.sslip.io kulupyonetim.130-61-177-72.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fkalpha.duckdns.org kulup.130-61-177-72.sslip.io kulupyonetim.130-61-177-72.sslip.io;

    ssl_certificate /etc/letsencrypt/live/fkalpha.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fkalpha.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/ubuntu/kulup_yonetim/swim_club_project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /home/ubuntu/kulup_yonetim/swim_club_project/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/kulup/kulup.sock;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
