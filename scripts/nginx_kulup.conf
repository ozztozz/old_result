server {
    listen 80;
    server_name kulup.130-61-177-72.sslip.io kulupyonetim.130-61-177-72.sslip.io;

    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/ubuntu/kulup_yonetim/swim_club_project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /home/ubuntu/kulup_yonetim/swim_club_project/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/kulup/kulup.sock;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
