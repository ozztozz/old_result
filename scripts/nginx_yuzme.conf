# HTTP -> HTTPS redirect & Default server
server {
    listen 80 default_server;
    server_name yuzme.duckdns.org yuzme.130-61-177-72.sslip.io 130-61-177-72.sslip.io _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name yuzme.duckdns.org yuzme.130-61-177-72.sslip.io 130-61-177-72.sslip.io;

    ssl_certificate /etc/letsencrypt/live/yuzme.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuzme.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/ubuntu/app/yuzme_projesi/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/yuzme/yuzme.sock;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
