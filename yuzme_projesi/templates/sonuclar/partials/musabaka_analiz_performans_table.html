{% load humanize %}
{% if dereceler %}
<div class="swim-table-wrapper">
    <table class="swim-table">
        <thead class="swim-thead">
            <tr>
                <th class="swim-th w-14 text-center">Sıra</th>
                <th class="swim-th">Sporcu</th>
                <th class="swim-th">Kulüp</th>
                <th class="swim-th text-center w-36">Branş</th>
                <th class="swim-th text-right w-28">Derece</th>
                <th class="swim-th text-center w-28">FINA Puanı</th>
            </tr>
        </thead>
        <tbody class="swim-tbody">
            {% for r in dereceler %}
            <tr class="swim-tr">
                <td class="swim-td text-center">{{ forloop.counter }}</td>
                <td class="swim-td">{{ r.sporcu.sporcu_adi }}</td>
                <td class="swim-td">{{ r.kulup.kulup_adi|default:"Ferdi" }}</td>
                <td class="swim-td text-center">{{ r.mesafe }}m {{ r.stil }}</td>
                <td class="swim-td text-right font-mono">{{ r.derece }}</td>
                <td class="swim-td text-center font-mono">{{ r.puan }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endif %}
