name: TYF Canli Yaris Takip Botu

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '*/10 5-18 * * *'
  workflow_dispatch:
    inputs:
      tyf_url:
        description: 'TYF Canli Yaris Sayfasi Linki'
        required: true
        default: 'https://canli.tyf.gov.tr/istanbul/cs-1005380/'
      django_api:
        description: 'Django API URL (Opsiyonel)'
        required: false
        default: ''

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Tesseract OCR (Turkce Dil Paketi) Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur libtesseract-dev

      - name: Python Bagimliliklarini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF pytesseract Pillow

      - name: TYF Canli Takip Botunu Calistir
        env:
          TYF_URL: ${{ github.event.inputs.tyf_url || 'https://canli.tyf.gov.tr/istanbul/cs-1005380/' }}
          DJANGO_API: ${{ github.event.inputs.django_api || secrets.DJANGO_API_URL }}
        run: |
          if [ -n "$DJANGO_API" ]; then
            echo "Django API bulundu: $DJANGO_API adresine veri aktarilacak."
            python src/tyf_live_worker.py --url "$TYF_URL" --api "$DJANGO_API" --save-json
          else
            echo "Django API adresi bos. Sonuclar live_results/ klasorune JSON olarak kaydedilecek."
            python src/tyf_live_worker.py --url "$TYF_URL" --save-json
          fi

      - name: Sonuclari GitHub Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canli-yaris-sonuclari
          path: live_results/
          retention-days: 7

      - name: Degisiklikleri Repoya Kaydet
        run: |
          git config user.name "TYF Bot"
          git config user.email "bot@tyf.gov.tr"
          git add processed_files.json live_results/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Guncel yaris sonuclari ve hafiza [skip ci]" && git push)
