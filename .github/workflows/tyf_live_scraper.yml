name: TYF Canli Yaris Takip Botu

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'live_results/**'
      - 'processed_files.json'
      - '**.md'
  schedule:
    - cron: '*/10 5-18 * * *'
  workflow_dispatch:
    inputs:
      tyf_url:
        description: 'TYF Canli Yaris Sayfasi Linki'
        required: true
        default: 'https://canli.tyf.gov.tr/istanbul/cs-1005380/'
      django_api:
        description: 'Django API URL (Örn: https://your-server.com/api/canli-aktar/)'
        required: false
        default: ''
      api_key:
        description: 'Opsiyonel X-Api-Key'
        required: false
        default: ''
      force:
        description: 'Zorla yeniden tara (Cache/SHA256 yoksay)'
        required: false
        type: boolean
        default: false

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Tesseract OCR (Turkce Dil Paketi) Kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur libtesseract-dev

      - name: Python Bagimliliklarini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sistem ve API Testlerini Dogrula
        run: |
          python yuzme_projesi/manage.py test sonuclar

      - name: TYF Canli Takip ve API Aktarimini Calistir
        env:
          TYF_URL: ${{ github.event.inputs.tyf_url || 'https://canli.tyf.gov.tr/istanbul/cs-1005380/' }}
          DJANGO_API: ${{ github.event.inputs.django_api || secrets.DJANGO_API_URL }}
          API_KEY: ${{ github.event.inputs.api_key || secrets.API_KEY }}
          FORCE_OPT: ${{ github.event.inputs.force == true && '--force' || '' }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$API_KEY" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --api-key $API_KEY"
          fi
          if [ -n "$FORCE_OPT" ]; then
            EXTRA_ARGS="$EXTRA_ARGS $FORCE_OPT"
          fi

          if [ -n "$DJANGO_API" ]; then
            echo "[*] Hedef Uzak Django API: $DJANGO_API"
            python src/tyf_live_worker.py --url "$TYF_URL" --api "$DJANGO_API" --save-json $EXTRA_ARGS
          else
            echo "[*] Uzak API tanimlanmamis. Yerel Django API baslatilarak islenecek..."
            python yuzme_projesi/manage.py runserver 127.0.0.1:8000 &
            sleep 4
            python src/tyf_live_worker.py --url "$TYF_URL" --api "http://127.0.0.1:8000/api/canli-aktar/" --save-json $EXTRA_ARGS
          fi

      - name: Sonuclari GitHub Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canli-yaris-sonuclari
          path: live_results/
          retention-days: 7

      - name: Degisiklikleri Repoya Kaydet
        run: |
          git config user.name "TYF Bot"
          git config user.email "bot@tyf.gov.tr"
          git add processed_files.json live_results/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Guncel yaris sonuclari ve hafiza [skip ci]" && git pull --rebase origin ${GITHUB_REF##*/} && git push origin ${GITHUB_REF##*/})
