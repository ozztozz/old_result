server {
    listen 80;
    server_name bizimbakkal.duckdns.org bizimbakkal.130-61-177-72.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 50M;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /static/ {
        alias /home/ubuntu/veresiye/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/veresiye/veresiye.sock;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

